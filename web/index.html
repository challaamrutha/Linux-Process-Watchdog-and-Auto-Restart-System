<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Watchdog</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#17212f;--mu:#5d6b7d;--bd:#d9dfe6;--ac:#0f766e;--ok:#15803d;--warn:#a16207;--crit:#b91c1c;--soft:#f3f6f8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#16212d;--tx:#e6ecf2;--mu:#93a1b3;--bd:#27364a;--ac:#2dd4bf;--ok:#4ade80;--warn:#facc15;--crit:#f87171;--soft:#1b2836}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--mu);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat,.panel{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:16px}.stats .stat{margin:0}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mu);font-size:13px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;color:var(--mu);font-weight:500;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--bd)}
td{padding:8px;border-bottom:1px solid var(--bd)}tr.sel td{background:var(--soft)}tr.row{cursor:pointer}
.badge{padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.running{color:var(--ok)}.backoff{color:var(--warn)}.gaveup{color:var(--crit)}.stopped{color:var(--mu)}
.bar{height:6px;background:var(--soft);width:70px;display:inline-block;margin-right:6px;border-radius:3px;overflow:hidden;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ac)}.bar i.hot{background:var(--crit)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:3px 9px;cursor:pointer}button:hover{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
canvas{width:100%;height:170px;display:block}.mono{font-family:ui-monospace,monospace;font-size:13px}
.log{max-height:320px;overflow:auto}.log div{padding:3px 0;border-bottom:1px dashed var(--bd)}.t{color:var(--mu);margin-right:8px}
.error,.critical{color:var(--crit)}.warn{color:var(--warn)}
</style></head><body>
<header><div><h1>Process Watchdog</h1><div class="sub">Live view of monitored processes, restarts and resource use</div></div><div class="sub" id="conn">connecting...</div></header>
<main>
<div class="stats" id="stats"></div>
<div class="panel scroll"><h2>Monitored processes</h2>
<table><thead><tr><th>Name</th><th>PID</th><th>Status</th><th>CPU</th><th>Memory</th><th>Uptime</th><th>Crashes</th><th>Retries</th><th>Policy</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="grid">
<div class="panel"><h2 id="cht">Resource history</h2><canvas id="ch" width="560" height="170"></canvas><div class="sub">Solid line: CPU %. Dashed line: memory as % of its limit. Click a row to switch.</div></div>
<div class="panel"><h2>Event log</h2><div class="log mono" id="log"></div></div>
</div></main>
<script>
var sel=0,last=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(s){return s>=60?Math.floor(s/60)+'m '+s%60+'s':s+'s'}
function act(name,a){fetch('/api/proc/'+encodeURIComponent(name)+'/'+a,{method:'POST',headers:{'X-Requested-With':'watchdog'}}).then(poll)}
function render(s){last=s;var P=s.processes;
 var run=P.filter(function(p){return p.status==='running'}).length,bad=P.filter(function(p){return p.status==='gaveup'}).length;
 var cr=P.reduce(function(a,p){return a+p.crashes},0);
 document.getElementById('stats').innerHTML=[[P.length,'Monitored'],[run,'Running'],[bad,'Gave up'],[cr,'Crashes detected'],[fmt(s.uptime),'Watchdog uptime']].map(function(x){return'<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('');
 document.getElementById('rows').innerHTML=P.map(function(p,i){var mp=p.rss_mb/p.mem_limit_mb*100;
  var lab=p.status==='gaveup'?'gave up':p.status==='backoff'?'restart in '+p.next_restart_in+'s':p.status;
  var b=p.status==='running'?'<button data-a="stop" data-n="'+esc(p.name)+'">Stop</button> <button data-a="restart" data-n="'+esc(p.name)+'">Restart</button>':'<button data-a="start" data-n="'+esc(p.name)+'">Start</button>';
  return'<tr class="row'+(i===sel?' sel':'')+'" data-i="'+i+'"><td><b>'+esc(p.name)+'</b><div class="sub mono">'+esc(p.command)+'</div></td><td class="mono">'+(p.pid||'-')+'</td><td><span class="badge '+p.status+'">'+esc(lab)+'</span></td>'+
  '<td><span class="bar"><i class="'+(p.cpu>p.cpu_limit?'hot':'')+'" style="width:'+Math.min(100,p.cpu)+'%"></i></span>'+p.cpu+'%</td>'+
  '<td><span class="bar"><i class="'+(mp>90?'hot':'')+'" style="width:'+Math.min(100,mp)+'%"></i></span>'+p.rss_mb+' MB</td><td>'+(p.status==='running'?fmt(p.uptime):'-')+'</td><td>'+p.crashes+'</td><td>'+p.streak+'/'+p.max_retries+'</td><td>'+esc(p.policy)+'</td><td>'+b+'</td></tr>'}).join('');
 chart()}
function chart(){if(!last)return;var p=last.processes[sel];if(!p)return;var c=document.getElementById('ch'),g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);
 var cs=getComputedStyle(document.documentElement),bd=cs.getPropertyValue('--bd'),ac=cs.getPropertyValue('--ac'),mu=cs.getPropertyValue('--mu');
 document.getElementById('cht').textContent='Resource history: '+p.name;g.strokeStyle=bd;g.fillStyle=mu;g.font='11px sans-serif';
 for(var k=0;k<=4;k++){var y=10+k*(h-24)/4;g.beginPath();g.moveTo(28,y);g.lineTo(w,y);g.stroke();g.fillText(100-k*25,2,y+4)}
 if(p.history.length<2)return;
 [[0,ac,[]],[1,mu,[5,4]]].forEach(function(s){g.beginPath();g.strokeStyle=s[1];g.lineWidth=2;g.setLineDash(s[2]);
  p.history.forEach(function(v,i){var x=28+i*(w-32)/59,y=10+(1-Math.min(100,v[s[0]])/100)*(h-24);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.setLineDash([])})}
function events(e){document.getElementById('log').innerHTML=e.map(function(x){return'<div class="'+x.level+'"><span class="t">'+x.time+'</span>'+esc(x.process)+': '+esc(x.message)+'</div>'}).join('')}
function poll(){Promise.all([fetch('/api/status').then(function(r){return r.json()}),fetch('/api/events').then(function(r){return r.json()})])
 .then(function(r){render(r[0]);events(r[1]);document.getElementById('conn').textContent='connected, updated '+new Date().toLocaleTimeString()})
 .catch(function(){document.getElementById('conn').textContent='daemon not reachable'})}
document.getElementById('rows').addEventListener('click',function(e){var b=e.target.closest('button');if(b){act(b.dataset.n,b.dataset.a);return}var r=e.target.closest('tr');if(r){sel=+r.dataset.i;render(last)}});
poll();setInterval(poll,2000);
</script></body></html>
